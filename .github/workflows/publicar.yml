name: Publicar site

# Publica a pasta site/ no GitHub Pages e, antes, atualiza stats.json com:
#  - downloads: soma dos downloads dos instaladores nas releases do repositório de instaladores
#  - convites:  pedidos aprovados no repositório de convites
# Roda a cada push e de hora em hora. Sem o segredo AUTOMACAO_TOKEN, publica com o stats.json do repositório.

# Por enquanto só manual (aguardando a logo). No lançamento, reativar:
#   push: { branches: [main] }
#   schedule: [{ cron: "23 * * * *" }]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Atualizar contador
        uses: actions/github-script@v8
        env:
          TEM_TOKEN: ${{ secrets.AUTOMACAO_TOKEN != '' }}
          BETA_REPO: ${{ vars.BETA_REPO || 'crumbs-beta' }}
          CONVITES_REPO: ${{ vars.CONVITES_REPO || 'crumbs-convites' }}
        with:
          github-token: ${{ secrets.AUTOMACAO_TOKEN || github.token }}
          script: |
            if (process.env.TEM_TOKEN !== "true") { core.notice("Sem AUTOMACAO_TOKEN: contador não atualizado."); return; }
            const fs = require("fs");
            const owner = context.repo.owner;
            const instalador = /\.(exe|msi|dmg|AppImage|deb|rpm)$/;
            let downloads = 0;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo: process.env.BETA_REPO, per_page: 100 });
            for (const r of releases) for (const a of r.assets) if (instalador.test(a.name)) downloads += a.download_count;
            const busca = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${process.env.CONVITES_REPO} is:issue label:aprovado`, per_page: 1,
            });
            const stats = { downloads, convites: busca.data.total_count, atualizado_em: new Date().toISOString() };
            fs.writeFileSync("site/stats.json", JSON.stringify(stats) + "\n");
            core.info(JSON.stringify(stats));

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
