name: Publicar site

# Publica a pasta site/ no GitHub Pages e, antes, atualiza stats.json com:
#  - downloads: soma dos downloads dos instaladores nas releases do repositório de instaladores
#  - convites:  pedidos aprovados no repositório de convites
# Roda a cada push e de hora em hora. Segredos: BETA_TOKEN (organização crumbs-lab, releases) e AUTOMACAO_TOKEN (conta pessoal, issues de convite).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Atualizar contador
        # Falha no contador nunca impede a publicação do site.
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          BETA_TOKEN: ${{ secrets.BETA_TOKEN }}
          CONVITES_TOKEN: ${{ secrets.AUTOMACAO_TOKEN }}
          BETA_REPO: ${{ vars.BETA_REPO || 'crumbs-lab/crumbs-beta' }}
          CONVITES_REPO: ${{ vars.CONVITES_REPO || 'hiazevedo/crumbs-convites' }}
        with:
          script: |
            const fs = require("fs");
            const api = async (token, path) => {
              const r = await fetch(`https://api.github.com${path}`, { headers: {
                Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "crumbs-site" } });
              if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
              return r.json();
            };
            const stats = JSON.parse(fs.readFileSync("site/stats.json", "utf8"));
            if (process.env.BETA_TOKEN) {
              const instalador = /\.(exe|msi|dmg|AppImage|deb|rpm)$/;
              const releases = await api(process.env.BETA_TOKEN, `/repos/${process.env.BETA_REPO}/releases?per_page=100`);
              stats.downloads = releases.flatMap((r) => r.assets).filter((a) => instalador.test(a.name)).reduce((n, a) => n + a.download_count, 0);
            } else core.notice("Sem BETA_TOKEN: downloads não atualizados.");
            if (process.env.CONVITES_TOKEN) {
              const q = encodeURIComponent(`repo:${process.env.CONVITES_REPO} is:issue label:aprovado`);
              stats.convites = (await api(process.env.CONVITES_TOKEN, `/search/issues?q=${q}&per_page=1`)).total_count;
            } else core.notice("Sem AUTOMACAO_TOKEN: convites não atualizados.");
            stats.atualizado_em = new Date().toISOString();
            fs.writeFileSync("site/stats.json", JSON.stringify(stats) + "\n");
            core.info(JSON.stringify(stats));

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
