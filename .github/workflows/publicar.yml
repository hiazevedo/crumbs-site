name: Publicar site

# Publica a pasta site/ no GitHub Pages e, antes, atualiza stats.json com:
#  - downloads: soma dos downloads dos instaladores nas releases do repositório de instaladores
#  - convites:  pedidos aprovados no repositório de convites
# Roda a cada push e de hora em hora. Segredos: BETA_TOKEN (organização crumbs-lab, releases) e AUTOMACAO_TOKEN (conta pessoal, issues de convite).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Atualizar contador
        uses: actions/github-script@v8
        env:
          BETA_TOKEN: ${{ secrets.BETA_TOKEN }}
          CONVITES_TOKEN: ${{ secrets.AUTOMACAO_TOKEN }}
          BETA_OWNER: ${{ vars.BETA_OWNER || 'crumbs-lab' }}
          BETA_REPO: ${{ vars.BETA_REPO || 'crumbs-beta' }}
          CONVITES_REPO: ${{ vars.CONVITES_REPO || 'hiazevedo/crumbs-convites' }}
        with:
          script: |
            const fs = require("fs");
            const atual = JSON.parse(fs.readFileSync("site/stats.json", "utf8"));
            const stats = { ...atual };
            if (process.env.BETA_TOKEN) {
              const beta = getOctokit(process.env.BETA_TOKEN);
              const instalador = /\.(exe|msi|dmg|AppImage|deb|rpm)$/;
              let downloads = 0;
              const releases = await beta.paginate(beta.rest.repos.listReleases, { owner: process.env.BETA_OWNER, repo: process.env.BETA_REPO, per_page: 100 });
              for (const r of releases) for (const a of r.assets) if (instalador.test(a.name)) downloads += a.download_count;
              stats.downloads = downloads;
            } else core.notice("Sem BETA_TOKEN: downloads não atualizados.");
            if (process.env.CONVITES_TOKEN) {
              const conv = getOctokit(process.env.CONVITES_TOKEN);
              const busca = await conv.rest.search.issuesAndPullRequests({ q: `repo:${process.env.CONVITES_REPO} is:issue label:aprovado`, per_page: 1 });
              stats.convites = busca.data.total_count;
            } else core.notice("Sem AUTOMACAO_TOKEN: convites não atualizados.");
            stats.atualizado_em = new Date().toISOString();
            fs.writeFileSync("site/stats.json", JSON.stringify(stats) + "\n");
            core.info(JSON.stringify(stats));

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
